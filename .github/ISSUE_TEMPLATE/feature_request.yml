name: "Feature request"
description: "Propose a new ETL feature, analytic query, or infra improvement"
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Use case"
      placeholder: "As an analyst I want … so that …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal"
      placeholder: "API, SQL, or DAG change. Note any schema / watermark impact."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options: ["ETL (PySpark)", "Validation (GX/PLpgSQL)", "SQL analytics", "Infra/Docker/Observability", "Docs/Tooling"]
    validations:
      required: true
