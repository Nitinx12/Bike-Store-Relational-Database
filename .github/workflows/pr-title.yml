name: "PR Title — Conventional Commits"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-title:
    name: Enforce Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            style
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Subject must start lowercase and not be empty (e.g. 'fix: resolve SparkUI bind')."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
