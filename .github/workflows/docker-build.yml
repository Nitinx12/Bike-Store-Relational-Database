name: "Docker Build & Smoke Test"

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "docker-compose.yml"
      - "src/**"
      - "scripts/**"
      - "utils/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "docker-compose.yml"
      - "src/**"
      - "scripts/**"
      - "utils/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build image and verify imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: bike-store-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify entrypoint responds
        run: docker run --rm bike-store-app:ci --help
      - name: Verify all expected modules import cleanly
        run: |
          docker run --rm --entrypoint bash bike-store-app:ci -c "
            uv run python -c '
          import src.pipeline.runner
          import src.validation.plpgsql_loops
          import utils.engine
          print(\"All imports OK\")
          '
          "
