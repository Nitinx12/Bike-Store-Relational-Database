[project]
name = "bike-store-relational-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "polars>=1.0.0",
    "pyarrow>=26.0.0",
    "pymongo>=4.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "sqlfluff>=4.0.0",
    "psycopg[binary]>=3.3.6",
    "great-expectations",
    "streamlit>=1.66.0",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/smoke"]
